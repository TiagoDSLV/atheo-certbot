# Configuration tbs-delivery - à copier dans /etc/tbs-delivery/config.yaml (chmod 640)
# Les secrets (mot de passe SMTP, jeton Gandi) sont lus dans des variables
# d'environnement définies dans /etc/tbs-delivery/env (chmod 600).

# dry-run : aucun mail n'est envoyé, ils sont écrits en .eml dans paths.outbox
# live    : envoi réel
mode: dry-run

paths:
  inventory: /var/lib/tbs-delivery/inventory.yaml   # éditable : destinataires, exclusions
  state_db: /var/lib/tbs-delivery/state.db
  deliveries: /var/lib/tbs-delivery/deliveries   # archives ZIP chiffrées (le mot de passe n'est pas conservé)
  outbox: /var/lib/tbs-delivery/outbox           # mails en mode dry-run
  log: /var/log/tbs-delivery/tbs-delivery.log

internal:
  team_email: certificats@atheo.net               # reçoit copies, alertes et synthèse
  sender: "Athéo Ingénierie - Certificats <certificats@atheo.net>"
  company: Athéo Ingénierie
  signature: |
    L'équipe Certificats
    Athéo Ingénierie - 03 xx xx xx xx

smtp:
  host: smtp.office365.com
  port: 587
  starttls: true
  ssl: false
  username: certificats@atheo.net
  password_env: TBS_DELIVERY_SMTP_PASSWORD

delivery:
  # client_admin = contact administratif de la commande TBS ; internal = team_email
  recipients: [client_admin]
  cc: [internal]
  # separate_email : 2e mail avec le mot de passe aux mêmes destinataires
  # internal_only  : mot de passe envoyé à l'équipe interne, qui le transmet par téléphone/SMS
  password_channel: separate_email
  zip_encrypt: true
  pfx: true
  pfx_legacy: false        # true = PFX 3DES/SHA1 pour Windows Server 2012/2016 et vieilles appliances
  attach_max_mb: 15

dcv:
  notify: [client_admin]   # qui doit créer l'enregistrement DNS
  cc: [internal]
  reminder_days: 3
  max_reminders: 5
  auto_dns:
    gandi:                 # zones hébergées par Athéo chez Gandi : création automatique
      enabled: false
      token_env: GANDI_TOKEN
      registrars: ["GANDI SAS"]
      zones: []            # ex. [atheo.net] - seules ces zones sont modifiées

policy:
  reissue_lead_days: 30    # doit correspondre à emergencyReissue dans conf.ini TBSCertBot
  renewal_alert_days: 60
  expiry_alert_days: 21
  forfait_end_margin_days: 15

tbscertbot:
  path: /opt/tbscertbot
  php: /usr/bin/php
  dcv_method_default: CNAME_CSR_HASH
  dcv_method_by_brand:
    digicert: DNSTXT_CSR_HASH
    geotrust: DNSTXT_CSR_HASH
    thawte: DNSTXT_CSR_HASH
    rapidssl: DNSTXT_CSR_HASH
